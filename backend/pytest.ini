[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# 测试文件匹配
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 排除目录
norecursedirs = .git .tox dist build *.egg .venv venv node_modules

# 输出选项
addopts = -v --tb=short

# 忽略 deprecation warnings
filterwarnings =
    ignore::DeprecationWarning
