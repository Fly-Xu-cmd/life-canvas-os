[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# 测试文件匹配
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 排除目录
norecursedirs = .git .tox dist build *.egg .venv venv node_modules __pycache__

# 输出选项
addopts = -v --tb=short --cov=backend --cov-report=term-missing --cov-report=xml

# 覆盖率配置
[coverage:run]
source = backend
omit =
    */tests/*
    */migrations/*
    */__pycache__/*
    */node_modules/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

# 忽略 deprecation warnings
filterwarnings =
    ignore::DeprecationWarning
